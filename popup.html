<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>alt自動生成（Gemini使用）</title>
  <style>
    /* 全体のベーススタイル（サイドパネル・ポップアップ両対応） */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      font-size: 13px;
      color: #1f2937;
      background-color: #f3f4f6;
      padding: 14px;
    }

    /* ヘッダー（タイトル・UI言語切り替え・ステータスバッジ） */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 14.5px;
      font-weight: 700;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ui-lang-select {
      padding: 3px 6px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 11px;
      background-color: #ffffff;
      color: #374151;
      cursor: pointer;
      outline: none;
    }

    .ui-lang-select:focus {
      border-color: #2563eb;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      background-color: #e5e7eb;
      color: #374151;
      white-space: nowrap;
    }

    .status-badge.running {
      background-color: #dbeafe;
      color: #1d4ed8;
    }

    /* 共通カードセクション */
    .section {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 12px;
      color: #374151;
    }

    .api-key-row {
      display: flex;
      gap: 6px;
    }

    input[type="password"],
    input[type="text"],
    select.full-select {
      flex: 1;
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      background-color: #ffffff;
      color: #111827;
      outline: none;
    }

    input[type="password"]:focus,
    input[type="text"]:focus,
    select.full-select:focus,
    textarea.custom-prompt:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .note {
      font-size: 11px;
      color: #6b7280;
      margin-top: 6px;
      line-height: 1.4;
    }

    /* 生成言語選択および追加プロンプト入力欄 */
    .field-group {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f3f4f6;
    }

    textarea.custom-prompt {
      width: 100%;
      min-height: 56px;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.45;
      color: #111827;
      resize: vertical;
      font-family: inherit;
      outline: none;
    }

    /* オプション設定（チェックボックス） */
    .option-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #f3f4f6;
    }

    .option-row input[type="checkbox"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .option-row label {
      margin-bottom: 0;
      font-weight: 500;
      font-size: 12px;
      color: #1f2937;
      cursor: pointer;
    }

    /* ボタン共通 */
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 600;
      transition: background-color 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .btn-save {
      background-color: #4b5563;
      color: #ffffff;
      font-size: 12px;
      padding: 7px 12px;
      white-space: nowrap;
    }

    .btn-save:hover:not(:disabled) {
      background-color: #374151;
    }

    /* メイン操作エリア（個別選択 ＆ 一括生成） */
    .picker-box {
      margin-bottom: 8px;
    }

    .btn-picker {
      width: 100%;
      background-color: #059669;
      color: #ffffff;
      padding: 10px 12px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-picker:hover:not(:disabled) {
      background-color: #047857;
    }

    .btn-picker.active {
      background-color: #d97706;
      animation: pulse-border 1.5s infinite;
    }

    @keyframes pulse-border {
      0% {
        box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.4);
      }
      70% {
        box-shadow: 0 0 0 6px rgba(217, 119, 6, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(217, 119, 6, 0);
      }
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn-start {
      flex: 2;
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-start:hover:not(:disabled) {
      background-color: #1d4ed8;
    }

    .btn-stop {
      flex: 1;
      background-color: #ef4444;
      color: #ffffff;
    }

    .btn-stop:hover:not(:disabled) {
      background-color: #dc2626;
    }

    /* 生成結果カード一覧エリア（HTMLコーディング用） */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #111827;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .btn-small {
      background: #e5e7eb;
      color: #374151;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .btn-small:hover {
      background: #d1d5db;
    }

    .btn-text {
      background: transparent;
      color: #6b7280;
      font-size: 11px;
      padding: 2px 6px;
      font-weight: 500;
    }

    .btn-text:hover {
      color: #111827;
      text-decoration: underline;
    }

    #result-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
      max-height: 360px;
      overflow-y: auto;
    }

    .empty-state {
      background: #ffffff;
      border: 1px dashed #d1d5db;
      border-radius: 8px;
      padding: 18px 12px;
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.5;
    }

    .result-card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .result-top {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .thumb-wrap {
      width: 64px;
      height: 48px;
      border-radius: 6px;
      overflow: hidden;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-meta {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-weight: 700;
      font-size: 12px;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scroll-hint {
      font-size: 10.5px;
      color: #2563eb;
      cursor: pointer;
      margin-top: 2px;
      display: inline-block;
    }

    .scroll-hint:hover {
      text-decoration: underline;
    }

    .alt-textarea {
      width: 100%;
      min-height: 46px;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.4;
      color: #111827;
      resize: vertical;
      font-family: inherit;
      margin-bottom: 6px;
    }

    .alt-textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .copy-row {
      display: flex;
      gap: 6px;
    }

    .btn-copy-alt {
      flex: 1;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 11.5px;
      padding: 6px 8px;
    }

    .btn-copy-alt:hover {
      background-color: #1d4ed8;
    }

    .btn-copy-attr {
      flex: 1;
      background-color: #f3f4f6;
      color: #1f2937;
      border: 1px solid #d1d5db;
      font-size: 11.5px;
      padding: 6px 8px;
    }

    .btn-copy-attr:hover {
      background-color: #e5e7eb;
    }

    /* 処理ログ（アコーディオン形式） */
    details.log-accordion {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }

    details.log-accordion summary {
      list-style: none;
      cursor: pointer;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      background-color: #f9fafb;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
    }

    details.log-accordion summary::-webkit-details-marker {
      display: none;
    }

    .summary-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .accordion-arrow {
      font-size: 10px;
      transition: transform 0.15s ease;
      display: inline-block;
    }

    details.log-accordion[open] .accordion-arrow {
      transform: rotate(90deg);
    }

    .log-count-badge {
      background: #e5e7eb;
      color: #4b5563;
      font-size: 10.5px;
      padding: 1px 6px;
      border-radius: 9999px;
      font-weight: 600;
    }

    #log-list {
      list-style: none;
      border-top: 1px solid #e5e7eb;
      max-height: 150px;
      overflow-y: auto;
      padding: 8px;
      font-size: 11px;
      line-height: 1.45;
    }

    .log-item {
      padding: 4px 6px;
      border-bottom: 1px solid #f3f4f6;
      word-break: break-all;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    /* info / error の色分け */
    .log-item.info {
      color: #1f2937;
      border-left: 3px solid #3b82f6;
      padding-left: 7px;
      margin-bottom: 4px;
      background-color: #f8fafc;
    }

    .log-item.error {
      color: #b91c1c;
      border-left: 3px solid #ef4444;
      padding-left: 7px;
      margin-bottom: 4px;
      background-color: #fef2f2;
    }

    .log-time {
      color: #6b7280;
      font-size: 10px;
      margin-right: 4px;
    }

    /* 機密情報に関する注意バナー */
    .caution-box {
      background-color: #fffbeb;
      border: 1px solid #fde68a;
      border-left: 3px solid #f59e0b;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 11px;
      line-height: 1.45;
      color: #92400e;
    }

    /* プライバシーポリシー表示エリア（アコーディオン） */
    details.privacy-accordion {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 8px;
    }

    details.privacy-accordion summary {
      list-style: none;
      cursor: pointer;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      background-color: #f9fafb;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
    }

    details.privacy-accordion summary::-webkit-details-marker {
      display: none;
    }

    details.privacy-accordion[open] .accordion-arrow {
      transform: rotate(90deg);
    }

    .privacy-content {
      border-top: 1px solid #e5e7eb;
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.55;
      color: #374151;
    }

    .privacy-content h2 {
      font-size: 11.5px;
      font-weight: 700;
      color: #111827;
      margin-top: 8px;
      margin-bottom: 3px;
    }

    .privacy-content h2:first-child {
      margin-top: 0;
    }

    .privacy-content ul {
      padding-left: 16px;
      margin-bottom: 6px;
    }

    .privacy-content li {
      margin-bottom: 3px;
    }
  </style>
</head>

<body>
  <!-- ヘッダー（タイトル・UI表示言語切り替え・ステータス） -->
  <div class="header-bar">
    <h1>
      <span id="app-title">alt自動生成（Gemini使用）</span>
    </h1>
    <div class="header-controls">
      <select id="ui-lang-select" class="ui-lang-select" title="UI Language / 表示言語">
        <option value="ja">🇯🇵 日本語</option>
        <option value="en">🇺🇸 English</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
      </select>
      <span id="status-badge" class="status-badge">待機中</span>
    </div>
  </div>

  <!-- APIキー・生成alt言語・追加プロンプト設定セクション -->
  <div class="section">
    <label for="api-key-input" id="label-api-key">Gemini APIキー</label>
    <div class="api-key-row">
      <input type="password" id="api-key-input" placeholder="＊＊＊＊＊＊＊＊＊＊＊" autocomplete="off">
      <button type="button" id="save-key-btn" class="btn-save">保存</button>
    </div>
    <p class="note" id="note-api-key">※APIキーはお使いのブラウザ内（chrome.storage.local）に平文で保存されます。</p>

    <!-- 生成するaltの言語選択 -->
    <div class="field-group">
      <label for="alt-lang-select" id="label-alt-lang">生成するaltの言語</label>
      <select id="alt-lang-select" class="full-select">
        <option value="ja">日本語 (Japanese)</option>
        <option value="en">English (英語)</option>
        <option value="ko">한국어 (Korean / 韓国語)</option>
        <option value="vi">Tiếng Việt (Vietnamese / ベトナム語)</option>
        <option value="zh">中文 简体 (Simplified Chinese / 中国語簡体)</option>
        <option value="tw">中文 繁體 (Traditional Chinese / 中国語繁体)</option>
        <option value="es">Español (Spanish / スペイン語)</option>
        <option value="fr">Français (French / フランス語)</option>
        <option value="de">Deutsch (German / ドイツ語)</option>
        <option value="id">Bahasa Indonesia (Indonesian / インドネシア語)</option>
        <option value="ms">Bahasa Melayu (Malay / マレー語)</option>
      </select>
    </div>

    <!-- トーン＆マナー調整用の追加プロンプト入力スペース -->
    <div class="field-group">
      <label for="custom-prompt-input" id="label-custom-prompt">追加プロンプト（トーン＆マナー・表記ルール）</label>
      <textarea
        id="custom-prompt-input"
        class="custom-prompt"
        placeholder="例：体言止めで簡潔にする／上質で落ち着いたトーンにする／30文字以内にする 等（空欄でも使用可能です）"
      ></textarea>
    </div>

    <div class="option-row">
      <input type="checkbox" id="overwrite-checkbox" checked>
      <label for="overwrite-checkbox" id="label-overwrite">一括生成時：既存のalt（ダミー等）がある画像も対象にする</label>
    </div>
  </div>

  <!-- 機密情報・個人情報の送信防止に関する注意喚起 -->
  <div class="caution-box" id="caution-box">
    ⚠️ <strong>機密情報の取り扱いに関するご注意</strong><br>
    選択・検出された画像および周辺テキストは Gemini API へ送信されます。<strong>個人情報・社外秘・未公開の機密情報</strong>が含まれる箇所には使用しないでください。
  </div>

  <!-- 操作ボタンセクション（個別カーソル選択 ＆ 一括生成） -->
  <div class="picker-box">
    <button type="button" id="picker-btn" class="btn-picker">
      🎯 カーソルで画像を選択してaltを作成
    </button>
  </div>
  <div class="actions">
    <button type="button" id="start-btn" class="btn-start">ページ内の画像を一括生成</button>
    <button type="button" id="stop-btn" class="btn-stop" disabled>停止</button>
  </div>

  <!-- 生成結果一覧（サムネイル＆コピー用） -->
  <div class="section-header">
    <span class="section-title" id="title-results">生成されたalt一覧（HTML貼り付け用）</span>
    <div class="header-actions">
      <button type="button" id="copy-all-btn" class="btn-small">全件コピー</button>
      <button type="button" id="clear-results-btn" class="btn-text">クリア</button>
    </div>
  </div>
  <div id="result-list"></div>

  <!-- 処理ログ表示セクション（アコーディオン） -->
  <details class="log-accordion" id="log-accordion">
    <summary>
      <span class="summary-left">
        <span class="accordion-arrow">▶</span>
        <span id="title-logs">処理ログ</span>
        <span id="log-count-badge" class="log-count-badge">0</span>
      </span>
      <button type="button" id="clear-log-btn" class="btn-text">ログを消去</button>
    </summary>
    <ul id="log-list"></ul>
  </details>

  <!-- プライバシーポリシー・ご利用上の注意（アコーディオン） -->
  <details class="privacy-accordion" id="privacy-accordion">
    <summary>
      <span class="summary-left">
        <span class="accordion-arrow">▶</span>
        <span id="title-privacy">🔒 プライバシーポリシー・ご利用上の注意</span>
      </span>
    </summary>
    <div class="privacy-content" id="privacy-body"></div>
  </details>

  <script src="popup.js"></script>
</body>

</html>
